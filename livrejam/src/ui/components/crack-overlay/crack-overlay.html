<svg
    class="crack-overlay"
    viewBox="0 0 100 100"
    preserveAspectRatio="none"
    aria-hidden="true"
    focusable="false"
>
    @for (crack of cracks(); track $index) {
        <path
            class="crack-overlay__line"
            [attr.d]="crack.path"
            [attr.stroke-width]="crack.width"
            pathLength="1"
            [style.animation-delay]="crack.delay + 's'"
            [style.animation-duration]="crack.duration + 's'"
        />
    }
</svg>
