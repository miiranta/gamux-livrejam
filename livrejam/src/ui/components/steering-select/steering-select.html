<div
    class="steering"
    role="radiogroup"
    [attr.aria-label]="'settings.steering.label' | translate"
>
    @for (mode of modes; track mode) {
        <button
            type="button"
            class="steering__option"
            role="radio"
            appHoverSound
            [class.steering__option--active]="settings.steeringMode() === mode"
            [attr.aria-checked]="settings.steeringMode() === mode"
            [attr.aria-label]="steeringModeLabelKey(mode) | translate"
            (click)="select(mode)"
        >
            <span class="steering__rim" aria-hidden="true"></span>

            <span class="steering__icon" aria-hidden="true">
                <app-pixel-icon [name]="mode === 'rizz' ? 'eye' : 'hand'" />
            </span>

            <span class="steering__label">{{ steeringModeLabelKey(mode) | translate }}</span>
        </button>
    }
</div>
