<div
    class="steering"
    role="radiogroup"
    [attr.aria-label]="'settings.steering.label' | translate"
>
    @for (mode of modes; track mode) {
        <button
            type="button"
            class="steering__option"
            role="radio"
            appHoverSound
            [class.steering__option--active]="settings.steeringMode() === mode"
            [attr.aria-checked]="settings.steeringMode() === mode"
            [attr.aria-label]="steeringModeLabelKey(mode) | translate"
            (click)="select(mode)"
        >
            <span class="steering__rim" aria-hidden="true"></span>

            @switch (mode) {
                @case ('67') {
                    <span class="steering__icon" aria-hidden="true">
                        <svg viewBox="0 0 16 16" class="steering__glyph">
                            <path
                                d="M5 7V3.5a1 1 0 0 1 2 0V7m0 0V2.5a1 1 0 0 1 2 0V7m0 0V3.5a1 1 0 0 1 2 0V7m0 0V5a1 1 0 0 1 2 0v4.5a4.5 4.5 0 0 1-4.5 4.5h-1A4.5 4.5 0 0 1 3 9.5V8a1 1 0 0 1 2 0"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.4"
                                stroke-linecap="square"
                                stroke-linejoin="miter"
                            />
                        </svg>
                    </span>
                }
                @case ('rizz') {
                    <span class="steering__icon" aria-hidden="true">
                        <svg viewBox="0 0 16 16" class="steering__glyph">
                            <path
                                d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8Z"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.4"
                                stroke-linejoin="miter"
                            />
                            <circle cx="8" cy="8" r="2" fill="currentColor" />
                        </svg>
                    </span>
                }
            }

            <span class="steering__label">{{ steeringModeLabelKey(mode) | translate }}</span>
        </button>
    }
</div>
