<div class="welcome" appGamepadMenu (back)="close()">
    <span class="welcome__backdrop" aria-hidden="true"></span>

    <!-- Corner shortcut to the repository, mirroring the link in the
         "libreSquared" achievement. -->
    <a
        class="welcome__github"
        appHoverSound
        [href]="repoUrl"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'welcome.githubLabel' | translate"
        [attr.title]="'welcome.githubLabel' | translate"
    >
        <span class="welcome__github-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                />
            </svg>
        </span>
    </a>

    <div class="welcome__scroll">
        <app-pixel-panel class="welcome__panel" titleKey="welcome.title">
            <div class="welcome__body">
                @for (key of introKeys; track key) {
                    <p class="welcome__paragraph">{{ key | translate }}</p>
                }

                <ul class="welcome__achievements">
                    @for (id of achievements; track id; let index = $index) {
                        <li class="welcome__achievement" [style.--lj-index]="index">
                            <h3 class="welcome__achievement-title">
                                <span class="welcome__glyph" aria-hidden="true">
                                    <svg viewBox="0 0 7 7">
                                        <path d="M3 0h1l3 3v1l-3 3H3L0 4V3z" />
                                    </svg>
                                </span>
                                {{ titleKey(id) | translate }}
                            </h3>
                            <!-- Bodies may carry a link (see the "libreSquared" entry), so they are
                                 bound as HTML; Angular sanitises them. -->
                            <p
                                class="welcome__achievement-body"
                                [innerHTML]="bodyKey(id) | translate"
                            ></p>
                        </li>
                    }
                </ul>
            </div>
        </app-pixel-panel>
    </div>

    <!-- Pinned to the bottom of the viewport: the way out is always in reach. -->
    <footer class="welcome__footer" data-gamepad-first>
        <app-pixel-button appHoverSound (pressed)="close()">
            {{ 'welcome.start' | translate }}
        </app-pixel-button>
    </footer>
</div>
